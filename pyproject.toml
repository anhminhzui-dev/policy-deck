[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "policy-deck"
version = "0.3.1"
description = "A small, readable shell-command policy classifier, scored like a model against a frozen, seeded, sha-pinned deck with a published error budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Evaluation-Only Licence. Source-available, NOT open source. See LICENSE." }
authors = [
    { name = "Vo Ba Hoang Minh", email = "anhminhzui-dev@users.noreply.github.com" },
]
dependencies = []
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
policy-deck = "policy_deck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_deck"]
